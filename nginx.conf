server {
    # 8080, not 80: nginx-unprivileged runs as a non-root user and cannot bind
    # a privileged port. The deployment's port/probes must target 8080.
    listen       8080;
    listen       [::]:8080;

    # The pipeline can attach several domains to one deployment, so accept any Host.
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;
    client_max_body_size 200M;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_proxied      expired no-cache no-store private auth;
    gzip_vary         on;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml application/rss+xml
                      font/woff font/woff2 application/font-woff
                      application/vnd.ms-fontobject image/svg+xml;

    # Cheap endpoint for readiness/liveness probes. The pipeline's probe params
    # default to /ping, so give it something that answers without touching the SPA.
    location = /ping {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        add_header Content-Type text/plain always;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Runtime configuration, written by the entrypoint on container start.
    # Must never be cached, or a redeploy with new settings keeps serving the old ones.
    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Hashed asset filenames are content-addressed, so they can be cached hard.
    # A missing asset must 404 rather than fall through to index.html — otherwise the
    # browser receives HTML with a JavaScript content type and fails opaquely.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must not be cached, otherwise browsers keep loading a stale document
    # that references asset hashes deleted by the last deploy.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA history fallback — client-side routes like /billing or /login/callback
    # are not files on disk and must still return the app shell.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
