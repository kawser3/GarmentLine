# Security headers, included into EVERY location block.
#
# This file exists because nginx does not merge `add_header` across configuration levels:
# as soon as a location defines any add_header of its own, the server-level ones are
# discarded for that location. Since every location here sets Cache-Control, defining
# these once at server level would silently drop them from all responses. Including the
# snippet per location is the only way to get them everywhere.
#
# No Content-Security-Policy: it would have to be tuned to the app's inline styles and the
# Blocks API origin, and a wrong CSP breaks the app in ways that are hard to diagnose.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "SAMEORIGIN" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
