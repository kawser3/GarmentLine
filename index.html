<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter for the interface, JetBrains Mono for figures: a dashboard read under
      pressure needs its numbers to line up in columns. Noto Sans Bengali for
      বাংলা, and it has to be FETCHED, not merely named — the font stack listed
      it while nothing loaded it, so every Bangla screen fell through to whatever
      the OS happened to have. A fallback that cannot shape Bengali draws each
      consonant and its vowel sign separately instead of composing them, which is
      what made the words unreadable rather than merely plain.

      One request for all three: the stylesheet used to @import Inter a second
      time, and an @import blocks rendering where a <link> does not.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta charset="UTF-8" />
    <!-- A running stitch resolving into a check — see public/favicon.svg. SVG only:
         there is no build step here that rasterises, and a <link> pointing at a PNG
         that nothing generates is how this file previously shipped a 404. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#147052" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report anything but 0.
         It lets the page extend under a notch, which is only safe because the shell pads
         itself back out by those insets — see the safe-area block in src/index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Sample approval and production issue tracking for knit-garment manufacturing: approved sample versions, an append-only issue trail, and repeat-defect alerts."
    />
    <title>GarmentLine — Sample Approval &amp; Production Issues</title>

    <!--
      Resolve the theme BEFORE the first paint.

      ThemeProvider does this in an effect, which is too late for the preloader below: it would
      paint on a light background and then flip, so a dark-theme user gets a white flash on every
      load. Same storage key and same precedence as components/theme.tsx — an explicit choice
      wins, otherwise the OS preference. React writes the identical attribute when it mounts.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("blocks-incident.theme");
          if (t !== "light" && t !== "dark") {
            /* Dark-first, matching components/theme.tsx. These two MUST agree:
               disagree and a dark-default visitor gets a white flash before the
               bundle executes, which is the whole reason this runs inline. */
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          /* Private-browsing modes can throw on read; the dark default is fine. */
        }
      })();
    </script>

    <!--
      The preloader, styled HERE rather than in src/index.css deliberately.

      In dev, index.css arrives as a JS import, so none of it applies until the bundle has
      executed — precisely the window this overlay exists to cover. Inline in the head, it is
      styled by the first paint in every mode, and the React transition overlay reuses the same
      rules rather than carrying a second copy.

      The mark repeats the wordmark's mask and its 2.5811 aspect ratio from components/logo.tsx
      instead of reusing `.logo`, for the same reason: `.logo` lives in the stylesheet that has
      not loaded yet.
    -->
    <style>
      .preload {
        position: fixed;
        inset: 0;
        /* Above the highest layer the app itself uses (80 — the quote bar). */
        z-index: 120;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: var(--page, #f8fafc);
        color: var(--fg, #1b2021);
      }

      [data-theme="dark"] .preload {
        background: var(--page, #09090b);
        color: var(--fg, #ffffff);
      }

      /*
        The product name, still, with one thin indeterminate bar as the only
        motion. No image mark and no rotation: a boot screen has to say "wait",
        not "look at me", and text is legible in both themes from the first
        paint without a single asset to fetch.
      */
      .preload-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      /*
        The mark, inline. It is the one thing on screen before the bundle lands,
        so it cannot be an <img> — a request for a logo is a request the overlay
        exists to cover. Colours are repeated here rather than taken from
        index.css for the same reason: that stylesheet has not loaded yet.
      */
      .preload-logo { width: 76px; height: 76px; display: block; }
      .preload-logo .gl-panel-a { fill: #12211c; }
      .preload-logo .gl-panel-b,
      .preload-logo .gl-stitch { fill: #1d9e75; }
      [data-theme="dark"] .preload-logo .gl-panel-a { fill: #e9eeec; }
      [data-theme="dark"] .preload-logo .gl-panel-b,
      [data-theme="dark"] .preload-logo .gl-stitch { fill: #2fbb8b; }

      /* The seam closes: panels in from either side, then the stitches land. */
      .preload-logo .gl-panel-a {
        animation: gl-seam-a 900ms cubic-bezier(0.6, 0.02, 0.18, 1) both;
      }
      .preload-logo .gl-panel-b {
        animation: gl-seam-b 900ms cubic-bezier(0.6, 0.02, 0.18, 1) both;
      }
      .preload-logo .gl-stitch { animation: gl-stitch 320ms ease-out both; }
      .preload-logo .gl-stitch:nth-of-type(1) { animation-delay: 640ms; }
      .preload-logo .gl-stitch:nth-of-type(2) { animation-delay: 760ms; }
      .preload-logo .gl-stitch:nth-of-type(3) { animation-delay: 880ms; }
      .preload-logo .gl-stitch:nth-of-type(4) { animation-delay: 1000ms; }
      @keyframes gl-seam-a { from { transform: translateX(-24px); } to { transform: none; } }
      @keyframes gl-seam-b { from { transform: translateX(24px); }  to { transform: none; } }
      @keyframes gl-stitch { from { opacity: 0; } to { opacity: 1; } }
      .preload-name {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0.04em;
      }
      .preload-bar {
        width: 148px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        position: relative;
        background: color-mix(in srgb, currentColor 14%, transparent);
      }
      .preload-bar::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 38%;
        border-radius: inherit;
        background: currentColor;
        animation: preload-slide 1.1s ease-in-out infinite;
      }
      @keyframes preload-slide {
        from { transform: translateX(-110%); }
        to   { transform: translateX(390%); }
      }

      /* Only the React overlay fades in — the boot one must be on screen at the first paint. */
      .preload.enter {
        animation: preload-in 160ms ease both;
      }

      .preload.leaving {
        pointer-events: none;
        animation: preload-out 280ms ease forwards;
      }

      @keyframes preload-in {
        from {
          opacity: 0;
        }
      }

      @keyframes preload-out {
        to {
          opacity: 0;
        }
      }

      /*
       * Reduced motion stops the bar's travel and fades it instead — the wait is
       * still communicated, without anything moving.
       */
      @media (prefers-reduced-motion: reduce) {
        .preload.enter,
        .preload-bar::before,
        .preload-logo .gl-panel-a,
        .preload-logo .gl-panel-b,
        .preload-logo .gl-stitch {
          animation: none;
        }
        /* `both` holds the first keyframe, which for the stitches is opacity 0 —
           cancelling the animation alone would leave the seam permanently
           unstitched. The still frame has to be the finished mark. */
        .preload-logo .gl-stitch { opacity: 1; }
        .preload-bar::before {
          width: 100%;
          opacity: 0.4;
        }
      }

      @media print {
        .preload {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Shown by the very first paint and removed by components/preloader.tsx once the app has
      mounted and its first screen has settled. Markup rather than React, because React is what
      we are waiting for: the bundle is ~450 kB and must be fetched, parsed and executed before
      it can render anything at all.
    -->
    <div class="preload" id="boot-preload" role="status" aria-label="Loading GarmentLine">
      <span class="preload-mark">
        <svg class="preload-logo" viewBox="0 0 100 100" aria-hidden="true">
          <path class="gl-panel-a" d="M20 0 L45.5 0 L35.5 25 L55.5 50 L35.5 75 L45.5 100 L20 100 A20 20 0 0 1 0 80 L0 20 A20 20 0 0 1 20 0 Z"/>
          <path class="gl-panel-b" d="M54.5 0 L80 0 A20 20 0 0 1 100 20 L100 80 A20 20 0 0 1 80 100 L54.5 100 L44.5 75 L64.5 50 L44.5 25 Z"/>
          <rect class="gl-stitch" x="-11" y="-2.5" width="22" height="5" rx="2.5" transform="translate(45 12.5) rotate(21.8)"/>
          <rect class="gl-stitch" x="-11" y="-2.5" width="22" height="5" rx="2.5" transform="translate(50 37.5) rotate(-38.7)"/>
          <rect class="gl-stitch" x="-11" y="-2.5" width="22" height="5" rx="2.5" transform="translate(50 62.5) rotate(38.7)"/>
          <rect class="gl-stitch" x="-11" y="-2.5" width="22" height="5" rx="2.5" transform="translate(45 87.5) rotate(-21.8)"/>
        </svg>
        <span class="preload-name">GarmentLine</span>
        <span class="preload-bar" aria-hidden></span>
      </span>
    </div>
    <!-- Runtime config, written by the container entrypoint. Must load before the app.
         Absent in local dev (404) — the app falls back to build-time env values. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
