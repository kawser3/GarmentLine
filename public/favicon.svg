<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GarmentLine">
  <title>GarmentLine</title>
  <!--
    A garment hanger: the one object that says "apparel" at 16px without a word
    of explanation. Geometric and stroked rather than illustrated, to sit with
    the Swiss/minimal system the rest of the interface uses. Composited on a
    solid tile so it survives a dark browser chrome.
  -->
  <rect width="32" height="32" rx="7.5" fill="#5b21b6"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 12.4 V10.2 a2.4 2.4 0 1 1 2.4 -2.4"/>
    <path d="M16 12.4 L6.4 20.6 H25.6 Z"/>
  </g>
</svg>
