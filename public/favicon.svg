<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GarmentLine">
  <title>GarmentLine</title>
  <!--
    A running stitch that resolves into a check: the two things this app is for,
    production work on the floor and the decision that a sample is approved.
    Composited on a solid tile rather than left transparent, so it stays visible
    against a dark browser chrome at 16px.
  -->
  <rect width="32" height="32" rx="7.5" fill="#0066b2"/>
  <path d="M7.6 16.9 L13.3 22.6 L24.6 9.6"
        fill="none" stroke="#ffffff" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="6 3.2"/>
</svg>
